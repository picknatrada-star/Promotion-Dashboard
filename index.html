}

  new Chart(document.getElementById('lineChart'),{type:'line',data:{
    labels:DAILY.map(d=>''+d.day),
    datasets:[
      {label:'เป้า/วัน',data:DAILY.map(d=>d.day_target),borderColor:'#94a3b8',borderDash:[4,4],pointRadius:0,tension:.3},
      {label:'ยอดจริง',data:DAILY.map(d=>d.day_actual),borderColor:'#4f46e5',backgroundColor:'rgba(79,70,229,.1)',fill:true,pointRadius:3,tension:.3}
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{ticks:{callback:v=>'฿'+(v/1000).toFixed(0)+'K',font:{size:10}}}}}});
  const tKeys=['Q','H','Z','D','E','N'];
  new Chart(document.getElementById('typeBar'),{type:'bar',data:{
    labels:tKeys.map(k=>k+' '+typeName[k]),
    datasets:[
      {label:'ยอดจริง',data:tKeys.map(k=>TYPE[k].actual),backgroundColor:tKeys.map(k=>typeColor[k]+'cc')},
      {label:'เป้า',data:tKeys.map(k=>TYPE[k].target),backgroundColor:'#e2e8f099',borderWidth:1,borderColor:'#94a3b8'}
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11}}}},scales:{y:{ticks:{callback:v=>'฿'+(v/1000000).toFixed(1)+'M',font:{size:10}}}}}});
  new Chart(document.getElementById('attainBar'),{type:'bar',data:{
    labels:tKeys.map(k=>k+' '+typeName[k]),
    datasets:[{label:'%บรรลุเป้า',data:tKeys.map(k=>TYPE[k].attain||0),backgroundColor:tKeys.map(k=>TYPE[k].attain>=80?'#10b981cc':TYPE[k].attain>=50?'#f59e0bcc':'#ef4444cc')}]
  },options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{max:150,ticks:{callback:v=>v+'%',font:{size:10}}}}}});
  const rmKeys=Object.keys(RM_ATT);
  new Chart(document.getElementById('rmBar'),{type:'bar',data:{
    labels:rmKeys.map(k=>k.split(' ')[0]),
    datasets:[{label:'%บรรลุเป้า',data:rmKeys.map(k=>RM_ATT[k].attain),backgroundColor:rmKeys.map(k=>RM_ATT[k].attain>=80?'#10b981cc':'#f59e0bcc')}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{max:120,ticks:{callback:v=>v+'%',font:{size:10}}}}}});
}
function renderTypeCards(){
  document.getElementById('typeCards').innerHTML=['Q','H','Z','D','E','N'].map(k=>{
    const t=TYPE[k],color=typeColor[k],a=t.attain,ac=a>=80?'#10b981':a>=50?'#f59e0b':'#ef4444';
    return `<div class="type-card" style="border-top-color:${color}"><div class="tc-type" style="color:${color}">${k}</div><div class="tc-name">${typeName[k]} (${t.sku_count} SKU)</div><div class="tc-val">${(t.actual/1000000).toFixed(2)}M ฿</div><div class="tc-att" style="color:${ac}">${a||'N/A'}% vs เป้า ${(t.target/1000000).toFixed(2)}M</div><div style="background:#f1f5f9;border-radius:4px;height:5px;margin-top:6px;overflow:hidden"><div style="height:100%;border-radius:4px;background:${ac};width:${Math.min(a||0,100)}%"></div></div></div>`;
  }).join('');
}
let skuSort={col:'actual',asc:false};
function renderSKU(){
  const ft=document.getElementById('fType').value,fs=document.getElementById('fStatus').value,fq=document.getElementById('fSKU').value.toLowerCase();
  let data=[...SKU].filter(s=>(!ft||s.type===ft)&&(!fs||s.status===fs)&&(!fq||s.name.toLowerCase().includes(fq)));
  data.sort((a,b)=>{let av=a[skuSort.col],bv=b[skuSort.col];if(av==null)av=-Infinity;if(bv==null)bv=-Infinity;return skuSort.asc?av-bv:bv-av;});
  document.getElementById('skuCount').textContent=`แสดง ${data.length} รายการ`;
  document.getElementById('skuTbody').innerHTML=data.map((s,i)=>`<tr><td>${i+1}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.name}">${s.name}</td><td><span class="bdg bdg-${s.type}">${s.type}</span></td><td style="text-align:right;font-weight:600">${(s.actual/1000).toFixed(1)}K</td><td style="text-align:right;color:#94a3b8">${s.target?'฿'+(s.target/1000).toFixed(1)+'K':'—'}</td><td style="text-align:right;font-weight:700;color:${attainColor(s.attain||0)}">${s.attain!=null?s.attain.toFixed(1)+'%':'—'}</td><td style="text-align:right">${s.gp_pct}%</td><td style="text-align:right">${s.branch_count}</td><td>${stLabel(s.status)}</td></tr>`).join('');
}
function sortSKU(col){if(skuSort.col===col)skuSort.asc=!skuSort.asc;else{skuSort.col=col;skuSort.asc=false;}renderSKU();}
function renderRM(){
  document.getElementById('rmGrid').innerHTML=Object.entries(RM_ATT).map(([name,r])=>{
    const ac=r.attain>=80?'#10b981':r.attain>=60?'#f59e0b':'#ef4444';
    return `<div class="rm-card" style="border-color:${ac}"><div class="rm-att" style="color:${ac}">${r.attain}%</div><div class="rm-name">${name}</div><div class="rm-sub">${r.branch_count} สาขา | GP ${r.gp_pct}% | เฉลี่ย ฿${(r.promo_sales/r.branch_count/1000).toFixed(1)}K/สาขา</div><div style="background:#f1f5f9;border-radius:4px;height:8px;overflow:hidden"><div style="height:100%;border-radius:4px;background:${ac};width:${Math.min(r.attain,100)}%"></div></div><div style="margin-top:8px;font-size:12px;color:#64748b">ยอดโปร: ฿${(r.promo_sales/1000000).toFixed(2)}M</div></div>`;
  }).join('');
}
let brSort={col:'attain',asc:false};
function renderBranch(){
  const rm=document.getElementById('bRM').value,st=document.getElementById('bStatus').value,q=document.getElementById('bSearch').value.toLowerCase();
  let data=[...BRANCH].filter(b=>(!rm||b.rm===rm)&&(!st||b.status===st)&&(!q||b.branch.toLowerCase().includes(q)||b.rm.toLowerCase().includes(q)));
  data.sort((a,b)=>{let av=a[brSort.col]||0,bv=b[brSort.col]||0;return brSort.asc?av-bv:bv-av;});
  document.getElementById('branchCount').textContent=`แสดง ${data.length}/203 สาขา`;
  document.getElementById('branchTbody').innerHTML=data.map((b,i)=>`<tr><td>${i+1}</td><td style="font-weight:600">${b.branch}</td><td style="font-size:11px;color:#64748b">${b.rm.split(' ')[0]}</td><td style="text-align:right;font-weight:600">฿${b.promo_sales.toLocaleString()}</td><td style="text-align:right">${b.promo_pct}%</td><td style="text-align:right;color:${b.gp_pct<25?'#ef4444':'#10b981'}">${b.gp_pct}%</td><td style="text-align:right;font-weight:700;color:${attainColor(b.attain)}">${b.attain}%</td><td>${stLabel(b.status)}</td></tr>`).join('');
}
function sortBranch(col){if(brSort.col===col)brSort.asc=!brSort.asc;else{brSort.col=col;brSort.asc=false;}renderBranch();}

initCharts();
